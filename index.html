<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Films & Séries Tracker</title><style>body{font-family:Segoe UI,sans-serif;background:#0f172a;color:#fff;max-width:1200px;margin:auto;padding:20px}.card{background:#1e293b;padding:15px;border-radius:12px;margin:12px 0}input,button,textarea,select{padding:8px;margin:4px;border-radius:8px;border:none}button{background:#2563eb;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #475569}</style></head><body><h1>🎬 Films & Séries Tracker</h1><div class='card'><h2>Ajouter un film</h2><input id='film' placeholder='Nom du film'><button onclick='addFilm()'>Ajouter</button></div><div class='card'><h2>🎥 Films à voir</h2><div id='filmsTodo'></div></div><div class='card'><h2>✅ Films vus</h2><div id='filmsDone'></div></div><div class='card'><h2>📺 Ajouter une série</h2><input id='serie' placeholder='Nom de la série'><textarea id='commentaire' placeholder='Commentaire, saison attendue...'></textarea><button onclick='addSerie()'>Ajouter</button></div><div class='card'><h2>📚 Liste des séries</h2><div id='seriesList'></div></div><script>let db=JSON.parse(localStorage.filmserie||'{"films":[],"vus":[],"series":[]}');function save(){localStorage.filmserie=JSON.stringify(db);render()}function addFilm(){if(!film.value)return;db.films.push({n:film.value});save();film.value='';}function markSeen(i){db.vus.push(db.films[i]);db.films.splice(i,1);save()}function delFilmSeen(i){db.vus.splice(i,1);save()}function addSerie(){if(!serie.value)return;db.series.push({n:serie.value,c:commentaire.value});save();serie.value='';commentaire.value='';}function editSerie(i){let s=db.series[i];s.n=prompt('Nom',s.n)||s.n;s.c=prompt('Commentaire',s.c)||s.c;save()}function delSerie(i){db.series.splice(i,1);save()}function render(){filmsTodo.innerHTML='<table><tr><th>Film</th><th>Action</th></tr>'+db.films.map((f,i)=>`<tr><td>${f.n}</td><td><button onclick="markSeen(${i})">✅ Vu</button></td></tr>`).join('')+'</table>';filmsDone.innerHTML='<table><tr><th>Film</th><th>Action</th></tr>'+db.vus.map((f,i)=>`<tr><td>${f.n}</td><td><button onclick="delFilmSeen(${i})">🗑️</button></td></tr>`).join('')+'</table>';seriesList.innerHTML='<table><tr><th>Série</th><th>Commentaire</th><th>Actions</th></tr>'+db.series.map((s,i)=>`<tr><td>${s.n}</td><td>${s.c}</td><td><button onclick="editSerie(${i})">✏️</button><button onclick="delSerie(${i})">🗑️</button></td></tr>`).join('')+'</table>';}render();</script></body></html>
