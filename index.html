<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Films & Séries Family Sync</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Segoe UI,sans-serif;background:#0f172a;color:#fff;max-width:1200px;margin:auto;padding:20px}.card{background:#1e293b;padding:15px;border-radius:12px;margin:12px 0}input,textarea,button{padding:8px;margin:4px;border:none;border-radius:8px}button{background:#2563eb;color:#fff}table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #475569}</style></head><body><h1>🎬 Films & Séries Family Sync</h1><div class='card'><h2>Ajouter un film</h2><input id='filmTitle' placeholder='Nom du film'><button onclick='addMovie()'>Ajouter</button></div><div class='card'><h2>Films à voir</h2><div id='moviesTodo'></div></div><div class='card'><h2>Films vus</h2><div id='moviesDone'></div></div><div class='card'><h2>Ajouter une série</h2><input id='seriesTitle' placeholder='Nom de la série'><textarea id='seriesComment' placeholder='Commentaire'></textarea><button onclick='addSeries()'>Ajouter</button></div><div class='card'><h2>Liste des séries</h2><div id='seriesList'></div></div><script src='app.js'></script></body></html>
